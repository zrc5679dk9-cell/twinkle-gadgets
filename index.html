<script>
async function loadHeroPhotos(){

  const slideshow = document.getElementById("heroSlideshow");
  const empty = document.getElementById("heroEmpty");

  const SAVED_HERO_KEY = "twinkle_gadgets_saved_hero_photos";

  try{

    /*
    1. First check the saved Hero Photos.
    If the Admin product was deleted, these remain available.
    */
    let savedPhotos = [];

    try{
      savedPhotos =
        JSON.parse(
          localStorage.getItem(SAVED_HERO_KEY) || "[]"
        );

      if(!Array.isArray(savedPhotos)){
        savedPhotos = [];
      }
    }catch(e){
      savedPhotos = [];
    }


    /*
    2. Try to get the latest Hero Photo from Admin.
    */
    const {data,error} =
      await supabaseClient
        .from("products")
        .select("*")
        .or(
          "name.ilike.%Hero Photo%,category.ilike.%Hero Photo%"
        )
        .order("created_at",{
          ascending:false
        });


    if(error)
      throw error;


    const freshPhotos = [];


    (data || []).forEach(product => {

      getImages(product).forEach(url => {

        if(
          typeof url === "string" &&
          url.trim() &&
          !freshPhotos.includes(url.trim())
        ){

          freshPhotos.push(url.trim());

        }

      });

    });


    /*
    3. If a new Hero Photo exists,
    save its URLs locally.
    */
    if(freshPhotos.length){

      savedPhotos = freshPhotos;

      localStorage.setItem(
        SAVED_HERO_KEY,
        JSON.stringify(savedPhotos)
      );

    }


    /*
    4. Use the newest Admin photos if available.
    Otherwise use the previously saved photos.
    */
    const photos =
      freshPhotos.length
        ? freshPhotos
        : savedPhotos;


    if(!photos.length){

      empty.textContent = "";
      return;

    }


    heroSlides = photos;


    empty.remove();


    heroSlides.forEach((url,index) => {

      const img =
        document.createElement("img");

      img.className =
        "hero-slide" +
        (index === 0 ? " active" : "");

      img.src = url;

      img.alt = "Twinkle Gadgets";

      img.loading =
        index === 0
          ? "eager"
          : "lazy";

      slideshow.appendChild(img);

    });


    buildHeroDots();


    if(heroSlides.length > 1){

      startHeroSlideshow();

    }


  }catch(error){

    console.error(
      "Hero Photo loading error:",
      error
    );


    /*
    If Supabase can't find the Hero Photo,
    use the previously saved version.
    */
    try{

      const saved =
        JSON.parse(
          localStorage.getItem(SAVED_HERO_KEY) || "[]"
        );


      if(Array.isArray(saved) && saved.length){

        heroSlides = saved;

        empty.remove();


        heroSlides.forEach((url,index) => {

          const img =
            document.createElement("img");

          img.className =
            "hero-slide" +
            (index === 0 ? " active" : "");

          img.src = url;

          img.alt =
            "Twinkle Gadgets";

          img.loading =
            index === 0
              ? "eager"
              : "lazy";

          slideshow.appendChild(img);

        });


        buildHeroDots();


        if(heroSlides.length > 1){

          startHeroSlideshow();

        }

      }else{

        empty.textContent = "";

      }

    }catch(e){

      empty.textContent = "";

    }

  }

}
</script>
