<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Twinkle Gadgets | Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

:root {
  --black: #0b0b0b;
  --cream: #f7f6f2;
  --gold: #b08a32;
  --gold-light: #d4b35a;
  --muted: #777;
  --line: rgba(0,0,0,.09);
  --white: #fff;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;

  background:
    radial-gradient(
      circle at 20% 0%,
      rgba(176,138,50,.12),
      transparent 30%
    ),
    var(--cream);

  color: var(--black);
  min-height: 100vh;
  padding: 20px;
}

.container {
  max-width: 900px;
  margin: auto;
}

/* HEADER */

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}

.brand {
  font-weight: 900;
  font-size: 20px;
  letter-spacing: -.5px;
}

.brand span {
  color: var(--gold);
}

.logout {
  border: 0;
  background: #111;
  color: white;
  padding: 10px 15px;
  border-radius: 20px;
  font-weight: 700;
}

/* LOGIN */

.login {
  max-width: 430px;
  margin: 80px auto;
  background: rgba(255,255,255,.72);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border: 1px solid rgba(255,255,255,.7);
  border-radius: 28px;
  padding: 30px;
  box-shadow: 0 25px 80px rgba(0,0,0,.08);
}

.login h1 {
  font-size: 32px;
  letter-spacing: -1.5px;
  margin-bottom: 8px;
}

.login h1 span {
  color: var(--gold);
}

.login p {
  color: var(--muted);
  font-size: 13px;
  margin-bottom: 25px;
}

/* FORM */

.card {
  background: rgba(255,255,255,.72);
  backdrop-filter: blur(25px);
  -webkit-backdrop-filter: blur(25px);
  border: 1px solid rgba(255,255,255,.75);
  border-radius: 28px;
  padding: 25px;
  margin-bottom: 20px;
  box-shadow: 0 20px 70px rgba(0,0,0,.06);
}

.card h2 {
  font-size: 22px;
  letter-spacing: -1px;
  margin-bottom: 20px;
}

label {
  display: block;
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 7px;
}

input,
select,
textarea {
  width: 100%;
  border: 1px solid var(--line);
  background: rgba(255,255,255,.85);
  border-radius: 14px;
  padding: 14px;
  font-size: 14px;
  outline: none;
  margin-bottom: 16px;
  font-family: inherit;
}

textarea {
  min-height: 130px;
  resize: vertical;
  line-height: 1.5;
}

input:focus,
select:focus,
textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 3px rgba(176,138,50,.1);
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

/* IMAGE UPLOAD */

.file-box {
  border: 1.5px dashed rgba(176,138,50,.5);
  border-radius: 18px;
  padding: 25px 15px;
  text-align: center;
  margin-bottom: 18px;
  background: rgba(176,138,50,.04);
}

.file-box input {
  margin: 10px 0 0;
  padding: 0;
  border: 0;
  background: transparent;
}

.photo-preview-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-top: 15px;
}

.photo-preview {
  position: relative;
  border-radius: 15px;
  overflow: hidden;
  aspect-ratio: 1;
  background: #eee;
}

.photo-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-number {
  position: absolute;
  left: 7px;
  top: 7px;
  background: rgba(0,0,0,.7);
  color: white;
  border-radius: 10px;
  padding: 4px 7px;
  font-size: 9px;
  font-weight: 800;
}

.existing-photo {
  position: relative;
}

.remove-photo {
  position: absolute;
  right: 7px;
  top: 7px;
  width: 25px;
  height: 25px;
  border: 0;
  border-radius: 50%;
  background: rgba(0,0,0,.75);
  color: white;
  font-weight: 900;
  cursor: pointer;
}

.primary {
  width: 100%;
  border: 0;
  border-radius: 25px;
  padding: 15px;
  background: #0b0b0b;
  color: white;
  font-size: 14px;
  font-weight: 800;
}

.primary:hover {
  color: var(--gold-light);
}

.primary:disabled {
  opacity: .6;
  cursor: not-allowed;
}

.message {
  margin-top: 12px;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
}

/* INVENTORY SUMMARY */

.inventory-summary {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.summary-box {
  background: rgba(255,255,255,.72);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.75);
  border-radius: 20px;
  padding: 17px;
}

.summary-number {
  font-size: 25px;
  font-weight: 900;
}

.summary-label {
  color: var(--muted);
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-top: 3px;
}

/* PRODUCTS */

.product-list {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.product {
  background: rgba(255,255,255,.75);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,.8);
  border-radius: 22px;
  overflow: hidden;
  box-shadow: 0 15px 50px rgba(0,0,0,.05);
  transition: .3s;
}

.product:hover {
  transform: translateY(-3px);
  box-shadow:
    0 20px 55px rgba(0,0,0,.08),
    0 0 25px rgba(176,138,50,.08);
}

.product-main-image {
  width: 100%;
  height: 210px;
  object-fit: cover;
  background: #eee;
}

.product-photo-count {
  position: absolute;
  left: 10px;
  bottom: 10px;
  background: rgba(0,0,0,.72);
  color: white;
  padding: 5px 9px;
  border-radius: 12px;
  font-size: 9px;
  font-weight: 800;
}

.product-image-wrap {
  position: relative;
}

.product-info {
  padding: 15px;
}

.product-name {
  font-weight: 800;
  font-size: 16px;
}

.product-meta {
  color: var(--muted);
  font-size: 11px;
  margin-top: 4px;
}

.product-battery {
  color: var(--muted);
  font-size: 10px;
  margin-top: 3px;
}

.product-description {
  color: #666;
  font-size: 11px;
  line-height: 1.4;
  margin-top: 8px;
}

.product-price {
  font-weight: 900;
  margin-top: 10px;
}

.status {
  display: inline-block;
  margin-top: 8px;
  padding: 5px 9px;
  border-radius: 10px;
  font-size: 9px;
  font-weight: 900;
  letter-spacing: .4px;
}

.available {
  background: rgba(0,150,70,.1);
  color: #087a3b;
}

.sold {
  background: rgba(200,0,0,.08);
  color: #a00000;
}

.product-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px;
  margin-top: 12px;
}

.edit,
.delete,
.toggle {
  border: 0;
  padding: 9px;
  border-radius: 15px;
  font-size: 10px;
  font-weight: 800;
}

.edit {
  background: #111;
  color: white;
}

.delete {
  background: #eee;
  color: #111;
}

.toggle {
  grid-column: 1 / -1;
  background: rgba(176,138,50,.12);
  color: #8b681e;
}

.toggle.sold-button {
  background: rgba(0,150,70,.10);
  color: #087a3b;
}

.hidden {
  display: none !important;
}

@media(max-width:600px) {

  body {
    padding: 14px;
  }

  .row {
    grid-template-columns: 1fr;
    gap: 0;
  }

  .inventory-summary {
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
  }

  .summary-box {
    padding: 13px 10px;
  }

  .summary-number {
    font-size: 20px;
  }

  .summary-label {
    font-size: 8px;
  }

  .product-list {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }

  .product-main-image {
    height: 170px;
  }

  .photo-preview-grid {
    grid-template-columns: repeat(3, 1fr);
  }

  .card {
    padding: 20px;
    border-radius: 23px;
  }

  .product-actions {
    grid-template-columns: 1fr 1fr;
  }

}

</style>

</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="loginScreen" class="login">

  <h1>
    Twinkle Gadgets<span>.</span>
  </h1>

  <p>
    Private product management
  </p>

  <form id="loginForm">

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="Your admin email"
      required
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Your password"
      required
    >

    <button class="primary">
      Login
    </button>

    <div id="loginMessage" class="message"></div>

  </form>

</div>


<!-- ADMIN -->

<div id="adminScreen" class="hidden">

  <div class="header">

    <div class="brand">
      TWINKLE GADGET<span>.</span>
    </div>

    <button class="logout" id="logoutBtn">
      Logout
    </button>

  </div>


  <!-- INVENTORY SUMMARY -->

  <div class="inventory-summary">

    <div class="summary-box">

      <div
        class="summary-number"
        id="totalCount">
        0
      </div>

      <div class="summary-label">
        Total
      </div>

    </div>

    <div class="summary-box">

      <div
        class="summary-number"
        id="availableCount">
        0
      </div>

      <div class="summary-label">
        Available
      </div>

    </div>

    <div class="summary-box">

      <div
        class="summary-number"
        id="soldCount">
        0
      </div>

      <div class="summary-label">
        Sold
      </div>

    </div>

  </div>


  <!-- ADD / EDIT PRODUCT -->

  <div class="card">

    <h2 id="formTitle">
      Add Product
    </h2>

    <form id="productForm">


      <!-- MULTIPLE PHOTOS -->

      <div class="file-box">

        <strong>
          📸 Product Photos
        </strong>

        <p
          style="font-size:12px;color:#777;margin-top:5px;">
          Select multiple photos from your iPhone
        </p>

        <input
          type="file"
          id="images"
          accept="image/*"
          multiple
        >

        <div
          id="photoPreviewGrid"
          class="photo-preview-grid">
        </div>

      </div>


      <label>
        Product Name
      </label>

      <input
        id="name"
        placeholder="e.g. iPhone 15 Pro Max"
        required
      >


      <div class="row">

        <div>

          <label>
            Storage
          </label>

          <input
            id="storage"
            placeholder="256GB"
          >

        </div>

        <div>

          <label>
            Battery
          </label>

          <input
            id="battery"
            placeholder="91%"
          >

        </div>

      </div>


      <div class="row">

        <div>

          <label>
            Condition
          </label>

          <select id="condition">

            <option>UK Used</option>
            <option>Brand New</option>
            <option>Nigerian Used</option>
            <option>Refurbished</option>

          </select>

        </div>


        <div>

          <label>
            Category
          </label>

          <select id="category">

            <option>iPhone</option>
            <option>Samsung</option>
            <option>Android</option>
            <option>Gadget</option>
            <option>Accessory</option>

          </select>

        </div>

      </div>


      <!-- DESCRIPTION -->

      <label>
        Description
      </label>

      <textarea
        id="description"
        placeholder="Describe the phone and point out important details...

Example:
Clean UK used device.
Face ID working perfectly.
True Tone available.
No repairs.
Small scratch on the frame.
Everything works perfectly."
      ></textarea>


      <label>
        Price
      </label>

      <input
        type="number"
        id="price"
        placeholder="350000"
        required
      >


      <label>
        Availability
      </label>

      <select id="available">

        <option value="true">
          Available
        </option>

        <option value="false">
          Sold
        </option>

      </select>


      <button
        class="primary"
        id="saveButton">
        Publish Product
      </button>

      <div
        id="productMessage"
        class="message">
      </div>

    </form>

  </div>


  <!-- PRODUCT LIST -->

  <div class="card">

    <h2>
      Your Products
    </h2>

    <div
      id="productList"
      class="product-list">
    </div>

  </div>

</div>

</div>


<script>

/* SUPABASE */

const SUPABASE_URL =
"https://tpasjsjofhxpslomciqd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_T23aVAQOy6JSldACQSNkFQ_TGQSEVMX";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


let editingId = null;
let editingImageUrls = [];


/* LOGIN */

document
.getElementById("loginForm")
.addEventListener("submit", async function(e) {

  e.preventDefault();

  const email =
    document.getElementById("email").value;

  const password =
    document.getElementById("password").value;

  const message =
    document.getElementById("loginMessage");

  message.textContent =
    "Logging in...";


  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


  if (error) {

    message.textContent =
      error.message;

    return;

  }

  message.textContent = "";

  showAdmin();

});


/* CHECK LOGIN */

async function checkUser() {

  const {
    data: { session }
  } =
    await supabaseClient.auth.getSession();


  if (session) {

    showAdmin();

  }

}


/* SHOW ADMIN */

function showAdmin() {

  document
    .getElementById("loginScreen")
    .classList.add("hidden");

  document
    .getElementById("adminScreen")
    .classList.remove("hidden");

  loadProducts();

}


/* LOGOUT */

document
.getElementById("logoutBtn")
.addEventListener("click", async function() {

  await supabaseClient.auth.signOut();

  location.reload();

});


/* MULTIPLE IMAGE PREVIEW */

document
.getElementById("images")
.addEventListener("change", function() {

  const files =
    Array.from(this.files);

  const grid =
    document.getElementById("photoPreviewGrid");

  grid.innerHTML = "";


  files.forEach((file, index) => {

    const reader =
      new FileReader();

    reader.onload = function(e) {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "photo-preview";

      wrapper.innerHTML = `

        <img
          src="${e.target.result}"
          alt="Product photo"
        >

        <div class="photo-number">
          ${index + 1}
        </div>

      `;

      grid.appendChild(wrapper);

    };

    reader.readAsDataURL(file);

  });

});


/* UPLOAD ONE IMAGE */

async function uploadImage(file) {

  const extension =
    file.name.split(".").pop();

  const fileName =
    crypto.randomUUID() +
    "." +
    extension;

  const path =
    "products/" + fileName;


  const { error } =
    await supabaseClient
      .storage
      .from("product-images")
      .upload(path, file, {
        cacheControl: "3600",
        upsert: false
      });


  if (error) {

    throw error;

  }


  const { data } =
    supabaseClient
      .storage
      .from("product-images")
      .getPublicUrl(path);


  return data.publicUrl;

}


/* UPLOAD MULTIPLE IMAGES */

async function uploadImages(files) {

  const urls = [];

  for (const file of files) {

    const url =
      await uploadImage(file);

    urls.push(url);

  }

  return urls;

}


/* SAVE PRODUCT */

document
.getElementById("productForm")
.addEventListener("submit", async function(e) {

  e.preventDefault();


  const message =
    document.getElementById("productMessage");

  const button =
    document.getElementById("saveButton");


  button.disabled = true;

  button.textContent =
    editingId
      ? "Updating..."
      : "Publishing...";

  message.textContent = "";


  try {

    const files =
      Array.from(
        document.getElementById("images").files
      );


    let imageUrls =
      [...editingImageUrls];


    /* Upload new photos */

    if (files.length) {

      const newUrls =
        await uploadImages(files);

      imageUrls =
        [
          ...imageUrls,
          ...newUrls
        ];

    }


    /* Keep first image compatible
       with the existing public site */

    const mainImage =
      imageUrls.length
        ? imageUrls[0]
        : null;


    const product = {

      name:
        document.getElementById("name").value.trim(),

      storage:
        document.getElementById("storage").value.trim(),

      condition:
        document.getElementById("condition").value,

      battery:
        document.getElementById("battery").value.trim(),

      category:
        document.getElementById("category").value,

      description:
        document.getElementById("description").value.trim(),

      price:
        Number(
          document.getElementById("price").value
        ),

      image_url:
        mainImage,

      image_urls:
        imageUrls,

      available:
        document.getElementById("available").value
        === "true"

    };


    let error;


    if (editingId) {

      const result =
        await supabaseClient
          .from("products")
          .update(product)
          .eq("id", editingId);

      error =
        result.error;

    } else {

      const result =
        await supabaseClient
          .from("products")
          .insert(product);

      error =
        result.error;

    }


    if (error) {

      throw error;

    }


    message.textContent =
      editingId
        ? "Product updated successfully."
        : "Product published successfully.";


    resetForm();

    await loadProducts();


  } catch(error) {

    console.error(error);

    message.textContent =
      error.message;

  }


  button.disabled = false;

  button.textContent =
    "Publish Product";

});


/* LOAD PRODUCTS */

async function loadProducts() {

  const list =
    document.getElementById("productList");

  list.innerHTML =
    "<p>Loading products...</p>";


  try {

    const { data, error } =
      await supabaseClient
        .from("products")
        .select("*")
        .order("created_at", {
          ascending: false
        });


    if (error) {

      console.error(error);

      list.innerHTML =
        "<p>" +
        escapeHtml(error.message) +
        "</p>";

      return;

    }


    const total =
      data.length;


    const available =
      data.filter(
        product =>
          product.available === true
      ).length;


    const sold =
      data.filter(
        product =>
          product.available === false
      ).length;


    document
      .getElementById("totalCount")
      .textContent =
      total;


    document
      .getElementById("availableCount")
      .textContent =
      available;


    document
      .getElementById("soldCount")
      .textContent =
      sold;


    if (!data.length) {

      list.innerHTML =
        `
        <p style="color:#777;font-size:13px;">
          No products yet.
          Add your first product above.
        </p>
        `;

      return;

    }


    list.innerHTML = "";


    data.forEach(product => {

      let imageUrls = [];


      if (
        Array.isArray(product.image_urls)
      ) {

        imageUrls =
          product.image_urls;

      }


      if (
        !imageUrls.length &&
        product.image_url
      ) {

        imageUrls =
          [product.image_url];

      }


      const mainImage =
        imageUrls[0];


      const image =
        mainImage

        ? `

          <div class="product-image-wrap">

            <img
              class="product-main-image"
              src="${escapeHtml(mainImage)}"
              alt="${escapeHtml(product.name)}"
            >

            ${
              imageUrls.length > 1
              ? `
                <div class="product-photo-count">
                  📸 ${imageUrls.length} photos
                </div>
                `
              : ""
            }

          </div>

          `

        : `

          <div
            style="
              height:210px;
              background:#eee;
              display:flex;
              align-items:center;
              justify-content:center;
              color:#777;
              font-size:12px;
            "
          >
            No photo
          </div>

          `;


      const status =
        product.available === true;


      cardRender:

      const card =
        document.createElement("div");


      card.className =
        "product";


      card.innerHTML = `

        ${image}

        <div class="product-info">

          <div class="product-name">
            ${escapeHtml(product.name)}
          </div>


          <div class="product-meta">

            ${escapeHtml(
              product.storage || ""
            )}

            ${
              product.storage
                ? " • "
                : ""
            }

            ${escapeHtml(
              product.condition || ""
            )}

          </div>


          ${
            product.battery
              ? `
                <div class="product-battery">
                  Battery:
                  ${escapeHtml(product.battery)}
                </div>
                `
              : ""
          }


          ${
            product.description
              ? `
                <div class="product-description">
                  ${escapeHtml(
                    product.description
                  ).substring(0, 120)}
                  ${
                    product.description.length > 120
                      ? "..."
                      : ""
                  }
                </div>
                `
              : ""
          }


          <div class="product-price">

            ₦${Number(
              product.price || 0
            ).toLocaleString("en-NG")}

          </div>


          <div
            class="status ${
              status
                ? "available"
                : "sold"
            }"
          >

            ${
              status
                ? "● AVAILABLE"
                : "● SOLD"
            }

          </div>


          <div class="product-actions">

            <button
              class="edit"
              onclick="editProduct('${product.id}')"
            >
              Edit
            </button>


            <button
              class="delete"
              onclick="deleteProduct('${product.id}')"
            >
              Delete
            </button>


            <button
              class="toggle ${
                status
                  ? ""
                  : "sold-button"
              }"
              onclick="toggleAvailability(
                '${product.id}',
                ${status}
              )"
            >

              ${
                status
                  ? "Mark as Sold"
                  : "Mark as Available"
              }

            </button>

          </div>

        </div>

      `;


      list.appendChild(card);

    });


  } catch (error) {

    console.error(error);

    list.innerHTML =
      `
      <p>
        ${escapeHtml(error.message)}
      </p>
      `;

  }

}


/* TOGGLE AVAILABLE / SOLD */

async function toggleAvailability(
  id,
  currentlyAvailable
) {

  const newStatus =
    !currentlyAvailable;


  const actionText =
    newStatus
      ? "mark this product as AVAILABLE"
      : "mark this product as SOLD";


  const confirmed =
    confirm(
      `Are you sure you want to ${actionText}?`
    );


  if (!confirmed) return;


  try {

    const { data, error } =
      await supabaseClient.rpc(
        "set_product_availability",
        {
          product_id: id,
          new_status: newStatus
        }
      );


    if (error) {

      alert(error.message);

      return;

    }


    if (!data) {

      alert(
        "The product could not be updated."
      );

      return;

    }


    await loadProducts();


  } catch (error) {

    console.error(error);

    alert(error.message);

  }

}


/* EDIT PRODUCT */

async function editProduct(id) {

  const { data, error } =
    await supabaseClient
      .from("products")
      .select("*")
      .eq("id", id)
      .single();


  if (error) {

    alert(error.message);

    return;

  }


  editingId =
    data.id;


  /* Load existing photos */

  if (
    Array.isArray(data.image_urls)
  ) {

    editingImageUrls =
      [...data.image_urls];

  } else if (
    data.image_url
  ) {

    editingImageUrls =
      [data.image_url];

  } else {

    editingImageUrls = [];

  }


  document
    .getElementById("name")
    .value =
    data.name || "";


  document
    .getElementById("storage")
    .value =
    data.storage || "";


  document
    .getElementById("battery")
    .value =
    data.battery || "";


  document
    .getElementById("condition")
    .value =
    data.condition || "UK Used";


  document
    .getElementById("category")
    .value =
    data.category || "iPhone";


  document
    .getElementById("description")
    .value =
    data.description || "";


  document
    .getElementById("price")
    .value =
    data.price || "";


  document
    .getElementById("available")
    .value =
    data.available
      ? "true"
      : "false";


  document
    .getElementById("formTitle")
    .textContent =
    "Edit Product";


  document
    .getElementById("saveButton")
    .textContent =
    "Update Product";


  renderExistingPhotos();


  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });

}


/* SHOW EXISTING PHOTOS */

function renderExistingPhotos() {

  const grid =
    document.getElementById(
      "photoPreviewGrid"
    );


  grid.innerHTML = "";


  editingImageUrls.forEach(
    (url, index) => {

      const wrapper =
        document.createElement("div");

      wrapper.className =
        "photo-preview existing-photo";


      wrapper.innerHTML = `

        <img
          src="${escapeHtml(url)}"
          alt="Product photo"
        >

        <div class="photo-number">
          ${index + 1}
        </div>

        <button
          type="button"
          class="remove-photo"
          onclick="removeExistingPhoto(${index})"
        >
          ×
        </button>

      `;


      grid.appendChild(wrapper);

    }
  );

}


/* REMOVE EXISTING PHOTO */

function removeExistingPhoto(index) {

  editingImageUrls.splice(
    index,
    1
  );

  renderExistingPhotos();

}


/* DELETE PRODUCT */

async function deleteProduct(id) {

  const confirmed =
    confirm(
      "Delete this product permanently?"
    );


  if (!confirmed) return;


  const { error } =
    await supabaseClient
      .from("products")
      .delete()
      .eq("id", id);


  if (error) {

    alert(error.message);

    return;

  }


  await loadProducts();

}


/* RESET FORM */

function resetForm() {

  editingId = null;

  editingImageUrls = [];


  document
    .getElementById("productForm")
    .reset();


  document
    .getElementById("photoPreviewGrid")
    .innerHTML =
    "";


  document
    .getElementById("formTitle")
    .textContent =
    "Add Product";


  document
    .getElementById("saveButton")
    .textContent =
    "Publish Product";

}


/* ESCAPE HTML */

function escapeHtml(text) {

  const div =
    document.createElement("div");

  div.textContent =
    text ?? "";

  return div.innerHTML;

}


/* START */

checkUser();
